name: Validate Plugin

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run deterministic offline suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tests -v

      - name: Compile runtime scripts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m compileall -q skills/banana/scripts tools tests

      - name: Validate installer syntax
        run: bash -n install.sh

  repository-contract:
    name: Repository contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install pinned verification tools
        run: python3 -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run lint, format, and strict typing gates
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          ruff check --no-cache skills/banana/scripts tools tests
          ruff format --check --no-cache skills/banana/scripts tools tests
          mypy --strict --no-incremental skills/banana/scripts tools tests

      - name: Run repository contract tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest -v tests.test_repo_contracts

      - name: Verify the exact source archive
        shell: bash
        run: |
          archive_dir="$(mktemp -d)"
          git archive HEAD | tar -x -C "${archive_dir}"
          cd "${archive_dir}"
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest -v tests.test_repo_contracts

      - name: Check skill size
        shell: bash
        run: |
          lines=$(wc -l < skills/banana/SKILL.md)
          if [ "${lines}" -gt 500 ]; then
            echo "::error::SKILL.md exceeds 500 lines"
            exit 1
          fi
          echo "SKILL.md: ${lines} lines"

      - name: Explain local Claude validation gate
        run: echo "Run 'claude plugin validate --strict .' before release; CI never installs or calls Claude or Gemini."

  validate:
    name: validate
    if: ${{ always() }}
    needs: [offline-tests, repository-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every validation job
        env:
          OFFLINE_TESTS_RESULT: ${{ needs.offline-tests.result }}
          REPOSITORY_CONTRACT_RESULT: ${{ needs.repository-contract.result }}
        run: |
          test "${OFFLINE_TESTS_RESULT}" = "success"
          test "${REPOSITORY_CONTRACT_RESULT}" = "success"
